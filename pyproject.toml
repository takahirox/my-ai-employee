[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "my-ai-employee"
version = "0.2.1"
description = "Deterministic trust kernel for a goal-driven, graph-first AI fleet runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "My AI Employee contributors" }]
keywords = ["ai", "agents", "workflow", "runtime", "graph"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
]

[project.urls]
Homepage = "https://github.com/takahirox/my-ai-employee"
Repository = "https://github.com/takahirox/my-ai-employee"
Issues = "https://github.com/takahirox/my-ai-employee/issues"
Changelog = "https://github.com/takahirox/my-ai-employee/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2.2,<2",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
fleet = "ai_employee.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_employee = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ai_employee"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
